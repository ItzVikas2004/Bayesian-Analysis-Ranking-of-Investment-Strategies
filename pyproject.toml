[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-investment"
version = "1.0.0"
description = "Bayesian analysis and uncertainty-aware ranking of systematic investment strategies"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<2.3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "statsmodels>=0.14,<1", "pymc>=5.16,<6", "arviz>=0.23,<1",
  "jax>=0.4,<1", "numpyro>=0.15,<1",
  "yfinance>=0.2.54,<2", "matplotlib>=3.8,<4", "seaborn>=0.13,<1",
  "PyYAML>=6,<7", "tabulate>=0.9,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
bayesian-investment = "bayesian_investment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: computational Bayesian sampling tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
